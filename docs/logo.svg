<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Pragma">
  <title>Pragma</title>

  <rect width="400" height="400" rx="48" fill="#0E0E0F"/>

  <!-- The check, split into two stroked segments so the ascender can
       carry display-weight (32) while the short stroke stays at 28.
       Heavier ascender = "this rising stroke is the load-bearing part
       of the inquiry"; the bend lands harder. -->
  <g fill="none" stroke="#E8954A" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 100 218 L 168 286" stroke-width="28"/>
    <path d="M 168 286 L 318 90 L 286 130" stroke-width="32"/>
  </g>

  <!-- The arrowhead — slightly larger than v1 (was 18→ now 22) so the
       inspection reward at 160px is unambiguous. -->
  <path d="M 286 130 L 264 119 L 280 146 Z" fill="#E8954A"/>
</svg>
