repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-format
      - id: ruff

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: bash -c 'PYTHONPATH=src .venv/bin/python -m pytest tests/ -q'
        language: system
        pass_filenames: false
        always_run: true

      - id: pragma
        name: pragma verify tests (dogfood)
        # Excludes test_classifier.py and test_inference.py — those test
        # the classifier itself and use trigger-pattern names on purpose.
        entry: bash -c 'PYTHONPATH=src .venv/bin/python -m pragma verify tests "$@"' --
        language: system
        files: '^tests/test_.*\.py$|^tests/.*/test_.*\.py$'
        exclude: '^tests/test_(classifier|inference)\.py$'
