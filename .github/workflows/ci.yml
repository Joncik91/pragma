name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Smoke — gamed fixtures rejected, verified fixture passes
        run: |
          # Exit-1 expected: any of the gamed fixtures.
          for f in tests/fixtures/gamed_*.py; do
            if python -m pragma verify tests "$f" >/dev/null 2>&1; then
              echo "ERROR: $f should have been rejected but was accepted"
              exit 1
            fi
          done
          # Exit-0 expected: the verified fixture.
          python -m pragma verify tests tests/fixtures/verified_ok.py
