name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,coverage,llm]"

      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Smoke — blocking fixtures rejected
        run: |
          for f in tests/fixtures/blocking/gamed_*.py tests/fixtures/blocking/test_orphan_target.py tests/fixtures/blocking/vitest_*.test.ts; do
            if python -m pragma verify tests "$f" >/dev/null 2>&1; then
              echo "ERROR: $f should have been rejected but was accepted"
              exit 1
            fi
          done

      - name: Smoke — warning fixtures pass but surface verdict
        run: |
          for f in tests/fixtures/warning/gamed_*.py tests/fixtures/warning/vitest_*.test.ts; do
            python -m pragma verify tests "$f" || {
              echo "ERROR: $f is warn-only and should not have blocked"
              exit 1
            }
          done

      - name: Smoke — verified fixture passes
        run: python -m pragma verify tests tests/fixtures/verified_ok.py
