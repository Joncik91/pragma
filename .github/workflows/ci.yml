name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Dogfood
        run: python -m pragma verify tests tests/test_inference.py tests/test_classifier.py tests/test_cli.py
